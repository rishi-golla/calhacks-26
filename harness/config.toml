# W1 harness: model pool, logical model names and the deterministic routing table.
# Served by harness/infra/serve_*.sh; all backends listen on 127.0.0.1 only.
policy_version = "w1-route-v1"
default_deadline_s = 60      # overall budget per call when metadata.max_latency_ms is absent
health_interval_s = 5

[backends.A]                 # Nemotron-3-Nano-Omni-30B-A3B-Reasoning (FP8 mix)
served_name = "nano"
url = "http://127.0.0.1:8001"
timeout_s = 45
max_concurrency = 8
[backends.A.extra_body]
chat_template_kwargs = { enable_thinking = false }

[backends.B]                 # Qwen3-4B-Instruct-2507
served_name = "qwen4b"
url = "http://127.0.0.1:8002"
timeout_s = 20
max_concurrency = 16

[backends.C]                 # gpt-oss-20b
served_name = "gptoss"
url = "http://127.0.0.1:8003"
timeout_s = 45
max_concurrency = 8
[backends.C.extra_body]
reasoning_effort = "low"

# Fully open models (open data + training code + weights), served by infra/serve_all_open.sh. Not in any chain
# until benchmarked; then they replace A/B/C.
[backends.D]                 # OLMoE-1B-7B-0125-Instruct (AI2): slot B, classify
served_name = "olmoe"
url = "http://127.0.0.1:8004"
timeout_s = 20
max_concurrency = 16

[backends.E]                 # Apertus-8B-Instruct-2509 (Swiss AI): slot C, cross-check
served_name = "apertus"
url = "http://127.0.0.1:8005"
timeout_s = 30
max_concurrency = 16

[backends.F]                 # Olmo-3-7B-Instruct (AI2): slot A candidate, extraction
served_name = "olmo3"
url = "http://127.0.0.1:8006"
timeout_s = 45
max_concurrency = 16

[backends.G]                 # OLMo-2-1124-13B-Instruct (AI2, FP8 on the fly): slot A candidate, extraction
served_name = "olmo2"
url = "http://127.0.0.1:8007"
timeout_s = 45
max_concurrency = 16

[backends.H]                 # SmolLM3-3B (Hugging Face): slot B candidate after OLMoE failed it
served_name = "smollm3"
url = "http://127.0.0.1:8008"
timeout_s = 20
max_concurrency = 16
[backends.H.extra_body]
chat_template_kwargs = { enable_thinking = false }

[backends.I]                 # Qwen3-4B-Instruct-2507-FP8: half the bytes per token of B on bandwidth-bound GB10
served_name = "qwen4bfp8"
url = "http://127.0.0.1:8009"
timeout_s = 20
max_concurrency = 16

# Logical name -> backends in preference order. The first healthy one serves; the rest are fallbacks.
# Speed and accuracy first (team decision 2026-10-24): fastest models that pass the accuracy tests on this box.
# Nano (A) finds personal data (amounts are exact code); Qwen3-4B (B) classifies 60/60 and audits personal data.
# Fully open alternatives and their results: OPEN_MODELS.md.
# C (gpt-oss) is out of rotation: its MXFP4 Marlin kernel emits NaN logits on GB10.
[logical]
small-fast = ["I", "B"]
reasoning = ["A"]
coder-tools = ["I", "B"]

# model="auto": the first matching rule wins. Match keys (all must hold):
#   task_type / agent / priority: list of values; stakes: string; has_tools / has_schema: bool.
# A rule sets either `model` (a logical name) or `ensemble` (logical names, run in parallel).
# Intake-side extraction from the data pipeline: one model, no ensemble. P-009 ensembles are for agents'
# high-stakes decisions; doubling every ingest call starved the GPU in the first sim run.
[[routes]]
match = { agent = ["ingest"] }
model = "reasoning"
reason = "ingest extraction -> reasoning (no ensemble)"

[[routes]]
match = { stakes = "high" }
ensemble = ["reasoning", "coder-tools"]
reason = "stakes=high -> ensemble"

[[routes]]
match = { task_type = ["classify_email", "classify_event", "classify"] }
model = "small-fast"
reason = "classification -> small-fast"

[[routes]]
match = { task_type = ["extract_invoice", "extract_document", "extract"] }
model = "reasoning"
reason = "extraction -> reasoning (Nano)"

[[routes]]
match = { task_type = ["verify_extraction", "pii_check"] }
model = "coder-tools"
reason = "cross-check -> coder-tools (different model family from the extractor)"

[[routes]]
match = { has_tools = true }
model = "coder-tools"
reason = "tools present -> coder-tools"

[[routes]]
match = {}
model = "reasoning"
reason = "default -> reasoning"
