[project]
name = "freightline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "a2a-sdk[http-server,postgresql]==1.2.3",
  "pydantic>=2.7",
  "httpx>=0.27",
  "phonenumbers>=9,<10",
  "redis>=5",
  "uvicorn>=0.30",
  "starlette>=0.37",
  "fastapi>=0.111",
  "fpdf2>=2.8,<3",
  "pypdf>=4,<6",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common*", "agents*", "harness*", "router*", "gateway*", "sim*", "ingest*", "integrations*", "evaluator*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "harness/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web"]
