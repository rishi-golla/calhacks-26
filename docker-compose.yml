services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: freight, POSTGRES_PASSWORD: freight, POSTGRES_DB: freight}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  # SpacetimeDB: W2 runs it with the `spacetime` CLI (`spacetime start`), see spacetime/README.md
volumes:
  pgdata: {}
